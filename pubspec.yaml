name: islami
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.2
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5

flutter_native_splash:
  color: "#202020"
  image: assets/images/ic_splash.png
  branding: assets/images/ic_bottom_splash.png
  branding_mode: bottom
  android_12:
    image: assets/images/ic_splash.png
    branding: assets/images/ic_bottom_splash.png
    color: "#202020"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/images/ic_splash-1.png
  android: "launcher_icon"
  ios: true
  adaptive_icon_background: "#212121"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/1.5x/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/images/4.0x/
    - assets/files/Suras/
    - assets/files/Hadeeth/
  fonts:
    - family: JannaLT
      fonts:
        - asset: assets/fonts/JannaLT-Bold.ttf
          weight: 700